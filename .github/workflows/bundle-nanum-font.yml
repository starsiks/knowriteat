name: Bundle NanumGothic font
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bundle-nanum-font.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download open-licensed NanumGothic and convert to WOFF2
        run: |
          python -m pip install 'fonttools[woff]' brotli
          curl -fL --retry 3 --connect-timeout 15 'https://raw.githubusercontent.com/ujuc/nanum-font/master/ttf/NanumGothic.ttf' -o /tmp/NanumGothic.ttf
          python - <<'PY'
          from fontTools.ttLib import TTFont
          font=TTFont('/tmp/NanumGothic.ttf')
          font.flavor='woff2'
          font.save('fonts/NanumGothic-Regular.woff2')
          PY
      - name: Commit font asset once
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fonts/NanumGothic-Regular.woff2
          if ! git diff --staged --quiet; then
            git commit -m 'Add self-hosted NanumGothic Regular WOFF2 font asset'
            git push
          fi
